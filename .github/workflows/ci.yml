name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # src/config.ts valida as env vars obrigatorias no import, entao qualquer
      # suite que puxe config transitivamente (agentTools, knowledgeTool) morria
      # com "Missing env var: TELEGRAM_BOT_TOKEN" -> "Cannot access 'config'
      # before initialization". Localmente passava so porque o Bun carrega o
      # .env sozinho. Valores fake: nenhum teste faz chamada de rede.
      - run: bun test
        env:
          TELEGRAM_BOT_TOKEN: ci-fake-token
          TELEGRAM_CHAT_ID: "0"
          LITELLM_API_KEY: ci-fake-key
          RCON_PASSWORD: ci-fake-rcon
      - run: bun run build
